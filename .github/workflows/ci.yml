name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:${{ runner.temp }}/replog-ci.db
      JWT_SECRET: replog-ci-secret-at-least-16-characters
      CLIENT_URL: http://127.0.0.1:5173
      VITE_API_URL: http://127.0.0.1:4000
      DOTENV_CONFIG_PATH: ${{ runner.temp }}/replog-empty.env
      DOTENV_CONFIG_QUIET: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.9.0

      - name: Show runtime versions
        run: node --version && npm --version

      - name: Create empty dotenv file
        run: touch "$DOTENV_CONFIG_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Apply migrations to a clean database
        run: npm run migrate:deploy -w server

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test compiled server
        run: npm run smoke:health

      - name: Check diff formatting
        run: git diff --check
