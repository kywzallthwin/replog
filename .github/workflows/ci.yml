name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: replog_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d replog_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/replog_ci?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/replog_ci?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/replog_test?schema=public
      JWT_SECRET: replog-ci-secret-at-least-16-characters
      CLIENT_URL: http://127.0.0.1:5173
      DOTENV_CONFIG_PATH: ${{ github.workspace }}/.ci-empty.env
      DOTENV_CONFIG_QUIET: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.9.0

      - name: Show runtime versions
        run: node --version && npm --version

      - name: Create empty dotenv file
        run: touch "$DOTENV_CONFIG_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Create isolated test database
        env:
          PGPASSWORD: postgres
        run: psql --host=127.0.0.1 --username=postgres --dbname=postgres --command="CREATE DATABASE replog_test"

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Apply migrations to a clean database
        run: npm run migrate:deploy -w server

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test compiled server
        run: npm run smoke:health

      - name: Check diff formatting
        run: git diff --check
